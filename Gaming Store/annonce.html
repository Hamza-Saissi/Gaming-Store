<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Store - Détails de l'Annonce</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
--dark_color: #19283f;
--green_color: #33d1cc;
}
body {
font-family: "Roboto", sans-serif;
}
.navbar {
background-color: var(--dark_color);
}
.navbar .navbar-nav .nav-link {
color: white;
}
.navbar .navbar-nav .nav-link.active,
.navbar .navbar-nav .nav-link:hover {
color: var(--green_color);
}
.btn-main {
background-color: var(--green_color);
color: var(--dark_color);
font-weight: 700;
border: none;
}
.btn-main:hover {
background-color: blanchedalmond;
color: black;
}
footer {
background-color: var(--dark_color);
color: white;
}
</style>
<script>
const themeSauvegarde = localStorage.getItem('theme_gaming') || 'light';
document.documentElement.setAttribute('data-bs-theme', themeSauvegarde);
</script>
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">
<div class="container">
<a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="index.html">
<i class="fa-solid fa-gamepad fa-lg" style="color: var(--green_color);"></i>
<span>GAMING STORE</span>
</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
<i class="fa-solid fa-bars text-white"></i>
</button>
<div class="collapse navbar-collapse" id="mainNav">
<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
<li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
<li class="nav-item"><a class="nav-link" href="catalogue.html">Catalogue</a></li>
<li class="nav-item"><a class="nav-link active" href="annonce.html?id=1">Annonce</a></li>
</ul>
<button class="btn btn-outline-light rounded-pill me-2" onclick="changerTheme()" id="btn-theme">
<i class="fa-solid fa-moon"></i>
</button>
</div>
</div>
</nav>
<div class="container py-5">
<a href="catalogue.html" class="btn btn-outline-secondary mb-4">
<i class="fa-solid fa-arrow-left me-2"></i>Retour au catalogue
</a>
<div class="card shadow-sm p-4">
<div class="row g-4 align-items-center" id="contenu-annonce"></div>
</div>
</div>
<footer class="py-4 mt-5">
<div class="container text-center">
<p class="mb-1 fw-bold"><i class="fa-solid fa-gamepad me-2" style="color: var(--green_color);"></i>GAMING STORE</p>
<p class="small text-white-50 mb-0">Projet Web Frontend - Pages Séparées</p>
</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const produits = [
{ id: 1, nom: "PC Gamer RTX 4070 Super", categorie: "PC Bureau", prix: 16500, image: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?auto=format&fit=crop&w=600&q=80", desc: "PC Gamer ultra rapide pour jouer en 1440p et 4K.", specs: ["Intel Core i7-13700K", "NVIDIA RTX 4070 Super 12Go", "32Go RAM DDR5", "SSD NVMe 1To"] },
{ id: 2, nom: "PC Gamer Ryzen 5 RX 7600", categorie: "PC Bureau", prix: 9800, image: "https://images.unsplash.com/photo-1593640408182-31c70c8268f5?auto=format&fit=crop&w=600&q=80", desc: "Excellent rapport qualité/prix pour le gaming Full HD.", specs: ["AMD Ryzen 5 7600", "Radeon RX 7600 8Go", "16Go RAM DDR5", "SSD NVMe 1To"] },
{ id: 3, nom: "ASUS ROG Strix G16", categorie: "Laptop", prix: 18900, image: "https://images.unsplash.com/photo-1603302576837-37561b2e2302?auto=format&fit=crop&w=600&q=80", desc: "PC portable gaming puissant avec écran 165Hz.", specs: ["Intel Core i7-13650HX", "NVIDIA RTX 4060 8Go", "16Go RAM", "Écran 16 pouces FHD+ 165Hz"] },
{ id: 4, nom: "MSI Katana 15", categorie: "Laptop", prix: 12500, image: "https://images.unsplash.com/photo-1525547719571-a2d4ac8945e2?auto=format&fit=crop&w=600&q=80", desc: "Laptop gaming polyvalent pour études et jeux.", specs: ["Intel Core i5-12450H", "NVIDIA RTX 4050 6Go", "16Go RAM", "SSD 512Go"] },
{ id: 5, nom: "MSI GeForce RTX 4080 Super", categorie: "Carte Graphique", prix: 13200, image: "https://images.unsplash.com/photo-1591488320449-011701bb6704?auto=format&fit=crop&w=600&q=80", desc: "Carte graphique haut de gamme avec refroidissement triple ventilateur.", specs: ["16Go GDDR6X", "DLSS 3.5 & Ray Tracing", "3x DisplayPort, 1x HDMI", "Consommation 320W"] },
{ id: 6, nom: "Gigabyte RTX 4060 Ti 8Go", categorie: "Carte Graphique", prix: 4800, image: "https://images.unsplash.com/photo-1555618254-51a81506d5a1?auto=format&fit=crop&w=600&q=80", desc: "Idéale pour faire tourner tous les jeux récents en Ultra 1080p.", specs: ["8Go GDDR6", "Architecture Ada Lovelace", "Double ventilateur Windforce", "PCIe 4.0"] }
];
function initialiserBoutonTheme() {
const themeActuel = document.documentElement.getAttribute('data-bs-theme');
const btn = document.getElementById('btn-theme');
if (themeActuel === 'dark') {
btn.innerHTML = '<i class="fa-solid fa-sun"></i>';
} else {
btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
}
}
function changerTheme() {
const html = document.documentElement;
let nouveauTheme = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
html.setAttribute('data-bs-theme', nouveauTheme);
localStorage.setItem('theme_gaming', nouveauTheme);
initialiserBoutonTheme();
}
const params = new URLSearchParams(window.location.search);
const idProd = parseInt(params.get('id')) || 1;
const p = produits.find(item => item.id === idProd) || produits[0];
const specsHTML = p.specs.map(s => `<li class="list-group-item"><i class="fa-solid fa-check text-success me-2"></i>${s}</li>`).join('');
document.getElementById('contenu-annonce').innerHTML = `
<div class="col-md-6">
<img src="${p.image}" class="img-fluid rounded shadow-sm w-100" alt="${p.nom}">
</div>
<div class="col-md-6">
<span class="badge bg-info text-dark mb-2">${p.categorie}</span>
<h2 class="fw-bold">${p.nom}</h2>
<h3 class="text-primary fw-bold my-3">${p.prix} DH</h3>
<p class="text-muted">${p.desc}</p>
<h5 class="fw-bold mt-4 mb-2">Caractéristiques :</h5>
<ul class="list-group mb-4">${specsHTML}</ul>
<button class="btn btn-main btn-lg rounded-pill px-4 w-100" onclick="alert('Produit ajouté au panier avec succès !')">
<i class="fa-solid fa-cart-plus me-2"></i>Ajouter au panier
</button>
</div>`;
initialiserBoutonTheme();
</script>
</body>
</html>
